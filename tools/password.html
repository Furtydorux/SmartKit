<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8">
<title>Password Generator Pro</title>
<link rel="icon" href="../icone/password.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    padding: 30px;
    border-radius: 20px;
    width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    text-align: center;
}

h2 {
    margin-bottom: 10px;
}

input[type="number"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
    font-size: 1rem;
}

.options {
    text-align: left;
    margin-top: 15px;
}

.options label {
    display: block;
    margin: 8px 0;
    font-size: 0.95rem;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #1d4ed8;
    transform: scale(1.03);
}

.result {
    margin-top: 15px;
    padding: 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    word-break: break-all;
    min-height: 20px;
}

/* 🔥 BARRE DE FORCE */
.strength-bar {
    height: 10px;
    width: 100%;
    background: #1f2937;
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
}

.strength-fill {
    height: 100%;
    width: 0%;
    transition: 0.3s;
    border-radius: 10px;
}

.copy {
    margin-top: 10px;
    background: #22c55e;
}

.copy:hover {
    background: #16a34a;
}
</style>

</head>

<body>

<div class="container">


<h2>🔐 Générateur PRO</h2>

<input type="number" id="length" min="4" max="50" value="12">

<div class="options">
    <label><input type="checkbox" id="uppercase" checked> Majuscules</label>
    <label><input type="checkbox" id="lowercase" checked> Minuscules</label>
    <label><input type="checkbox" id="numbers" checked> Chiffres</label>
    <label><input type="checkbox" id="symbols" checked> Caractères spéciaux</label>

    <!-- 🔥 NOUVELLE OPTION -->
    <label><input type="checkbox" id="avoidConfusing"> Exclure caractères confus (0/O, l/I)</label>
</div>

<button onclick="generate()">Générer</button>

<div class="result" id="output">---</div>

<!-- BARRE DE FORCE -->
<div class="strength-bar">
    <div id="bar" class="strength-fill"></div>
</div>

<button class="copy" onclick="copyPassword()">Copier</button>


</div>

<script>

function generate() {
    const length = document.getElementById("length").value;
    const upper = document.getElementById("uppercase").checked;
    const lower = document.getElementById("lowercase").checked;
    const numbers = document.getElementById("numbers").checked;
    const symbols = document.getElementById("symbols").checked;
    const avoid = document.getElementById("avoidConfusing").checked;

    let U = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let L = "abcdefghijklmnopqrstuvwxyz";
    let N = "0123456789";
    let S = "!@#$%^&*()_+-=[]{}|;:,.<>?/~`";

    // 🔥 suppression caractères confus
    if (avoid) {
        U = U.replace(/[O]/g, "").replace(/[I]/g, "");
        L = L.replace(/[l]/g, "");
        N = N.replace(/[0]/g, "");
    }

    let chars = "";
    if (upper) chars += U;
    if (lower) chars += L;
    if (numbers) chars += N;
    if (symbols) chars += S;

    if (chars === "") {
        document.getElementById("output").innerText = "Choisis au moins une option";
        return;
    }

    let password = "";
    for (let i = 0; i < length; i++) {
        password += chars[Math.floor(Math.random() * chars.length)];
    }

    document.getElementById("output").innerText = password;

    updateStrength(password);
}

function updateStrength(pwd) {
    let score = 0;

    if (pwd.length >= 12) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;

    const bar = document.getElementById("bar");

    const colors = ["#ef4444", "#f97316", "#eab308", "#84cc16", "#22c55e"];
    const widths = ["20%", "40%", "60%", "80%", "100%"];

    bar.style.width = widths[score];
    bar.style.background = colors[score];
}

function copyPassword() {
    const text = document.getElementById("output").innerText;
    navigator.clipboard.writeText(text);
    alert("Mot de passe copié !");
}

</script>

</body>
</html>

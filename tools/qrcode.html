<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8">
<title>QR Code Ultra Pro</title>
<link rel="icon" href="../icone/qrcode.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/qr-code-styling/lib/qr-code-styling.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    align-items: center;
}

.container {
    width: 540px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    padding: 25px;
    border-radius: 20px;
    text-align: center;
}

/* INPUTS */
input {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

/* COLOR BOX */
.color-box {
    text-align: left;
    font-size: 0.85rem;
    margin-top: 10px;
}

.color-box small {
    opacity: 0.6;
}

/* STYLE GRID */
.style-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.style-card {
    background: rgba(255,255,255,0.07);
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    border: 2px solid transparent;
}

.style-card:hover {
    transform: scale(1.05);
}

.style-card.active {
    border: 2px solid #22c55e;
    background: rgba(34,197,94,0.15);
}

.preview {
    width: 35px;
    height: 35px;
    margin: auto;
    margin-bottom: 5px;
}

.rounded { border-radius: 10px; background: #2563eb; }
.dots { border-radius: 50%; background: #22c55e; }
.classy { border-radius: 20px; background: #f97316; }
.square { background: #ef4444; }

/* BUTTONS */
button {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #1d4ed8;
    transform: scale(1.03);
}

/* 📁 UPLOAD BUTTON STYLÉ */
.upload-label {
    display: block;
    margin-top: 10px;
    padding: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px dashed rgba(255,255,255,0.3);
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.upload-label:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.02);
}

/* QR */
#qr {
    margin-top: 20px;
    display: flex;
    justify-content: center;
}
</style>

</head>

<body>

<div class="container">


<h2>📱 QR Code Ultra Pro</h2>

<input type="text" id="text" placeholder="Lien ou texte">

<!-- 🎨 GRADIENT -->
<div class="color-box">
    <label>🎨 Couleur 1 (QR)</label>
    <input type="color" id="c1" value="#000000">
    <small>Couleur principale du QR code</small>
</div>

<div class="color-box">
    <label>🌈 Couleur 2 (dégradé)</label>
    <input type="color" id="c2" value="#2563eb">
    <small>Deuxième couleur du dégradé</small>
</div>

<!-- 🖼 BACKGROUND (RESTE BIEN PRÉSENT) -->
<div class="color-box">
    <label>🖼️ Couleur de fond</label>
    <input type="color" id="bg" value="#ffffff">
    <small>Arrière-plan du QR code</small>
</div>

<!-- STYLE -->
<div class="style-grid">

    <div class="style-card active" onclick="setStyle(this,'rounded')">
        <div class="preview rounded"></div>
        Instagram
    </div>

    <div class="style-card" onclick="setStyle(this,'dots')">
        <div class="preview dots"></div>
        Points
    </div>

    <div class="style-card" onclick="setStyle(this,'classy-rounded')">
        <div class="preview classy"></div>
        Classy
    </div>

    <div class="style-card" onclick="setStyle(this,'square')">
        <div class="preview square"></div>
        Carré
    </div>

</div>

<input type="hidden" id="style" value="rounded">

<!-- 🧠 LOGO UPLOAD (RESTE PROPRE) -->
<label class="upload-label">
    🧠 Choisir un logo
    <input type="file" id="logo" hidden>
</label>

<button onclick="generate()">🎯 Générer QR</button>
<button onclick="downloadQR()">📥 Télécharger PNG</button>

<div id="qr"></div>


</div>

<script>

let qr;

function setStyle(el, value) {

    document.getElementById("style").value = value;

    document.querySelectorAll(".style-card").forEach(c => {
        c.classList.remove("active");
    });

    el.classList.add("active");
}

function generate() {

    let text = document.getElementById("text").value;
    let c1 = document.getElementById("c1").value;
    let c2 = document.getElementById("c2").value;
    let bg = document.getElementById("bg").value;
    let style = document.getElementById("style").value;
    let file = document.getElementById("logo").files[0];

    if (!text) return alert("Entre un texte");

    let logo = file ? URL.createObjectURL(file) : "";

    document.getElementById("qr").innerHTML = "";

    qr = new QRCodeStyling({
        width: 260,
        height: 260,
        data: text,
        image: logo,

        dotsOptions: {
            type: style,
            gradient: {
                type: "linear",
                rotation: 0,
                colorStops: [
                    { offset: 0, color: c1 },
                    { offset: 1, color: c2 }
                ]
            }
        },

        backgroundOptions: {
            color: bg
        },

        imageOptions: {
            margin: 5,
            imageSize: 0.35
        }
    });

    qr.append(document.getElementById("qr"));
}

function downloadQR() {
    if (!qr) return alert("Génère un QR d'abord");
    qr.download({ name: "qr-code", extension: "png" });
}

</script>

</body>
</html>

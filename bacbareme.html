<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Simulateur Bac</title>
<link rel="icon" href="../img/bac.png">

<style>
* { box-sizing: border-box; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
    margin: 0;
    color: white;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 40px rgba(0,255,255,0.2);
}

h1, h2 { text-align: center; }

table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    padding: 10px;
    text-align: center;
}

input {
    width: 70px;
    padding: 8px;
    border-radius: 8px;
    border: none;
    text-align: center;
}

.actions {
    text-align: center;
    margin-top: 20px;
}

button, .file-label {
    padding: 12px 20px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    color: white;
    transition: 0.3s;
}

button:hover { transform: scale(1.05); }

input[type="file"] { display: none; }

/* POPUP FUTURISTE */
/* POPUP ULTRA FUTURISTE */
.popup {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: radial-gradient(circle, rgba(0,0,0,0.9), rgba(0,0,0,1));
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:0.4s;
}

.popup.active {
    opacity:1;
    pointer-events:auto;
}

.popup-content {
    position: relative;
    padding: 50px;
    border-radius: 25px;
    text-align:center;
    backdrop-filter: blur(30px);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0,255,255,0.3);
    box-shadow:
        0 0 40px rgba(0,255,255,0.6),
        inset 0 0 20px rgba(0,255,255,0.2);
    animation: popUltra 0.5s ease;
}

/* halo animé */
.popup-content::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 25px;
    background: linear-gradient(45deg, cyan, blue, purple, cyan);
    z-index: -1;
    filter: blur(20px);
    opacity: 0.7;
    animation: rotateGlow 6s linear infinite;
}

@keyframes rotateGlow {
    0% { filter: blur(20px) hue-rotate(0deg); }
    100% { filter: blur(20px) hue-rotate(360deg); }
}

@keyframes popUltra {
    from { transform: scale(0.6) rotateX(20deg); opacity:0; }
    to { transform: scale(1) rotateX(0); opacity:1; }
}

.result-note {
    font-size: 65px;
    font-weight: bold;
    background: linear-gradient(90deg, #00f2fe, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 25px rgba(0,255,255,0.8);
    margin-bottom: 10px;
}

.mention {
    font-size: 26px;
    margin-top: 10px;
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(0,255,255,0.15);
    display: inline-block;
    box-shadow: 0 0 15px rgba(0,255,255,0.5);
}

.potential {
    margin-top: 25px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 18px;
    box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div class="container">
<h1>🎓 Simulateur Bac</h1>

<h2>📘 Épreuves finales</h2>
<table id="finales">
<tr><th>Matière</th><th>Note</th><th>Coef</th></tr>
<tr><td>Philosophie</td><td><input></td><td class="coef">8</td></tr>
<tr><td>Grand Oral</td><td><input></td><td class="coef">10</td></tr>
<tr><td>Spécialité 1</td><td><input></td><td class="coef">16</td></tr>
<tr><td>Spécialité 2</td><td><input></td><td class="coef">16</td></tr>
</table>

<h2>📗 Contrôle continu</h2>
<table id="cc">
<tr>
<th>Matière</th>
<th>Première</th>
<th>Terminale</th>
<th>Coef</th>
</tr>

<tr>
<td>Français écrit</td>
<td><input></td>
<td>-</td>
<td class="coef">5</td>
</tr>

<tr>
<td>Français oral</td>
<td><input></td>
<td>-</td>
<td class="coef">5</td>
</tr>

<tr>
<td>Histoire-Géo</td>
<td><input></td>
<td><input></td>
<td class="coef">6</td>
</tr>

<tr>
<td>LVA</td>
<td><input></td>
<td><input></td>
<td class="coef">6</td>
</tr>

<tr>
<td>LVB</td>
<td><input></td>
<td><input></td>
<td class="coef">6</td>
</tr>

<tr>
<td>EPS</td>
<td>-</td>
<td><input></td>
<td class="coef">6</td>
</tr>

<tr>
<td>Enseignement scientifique</td>
<td><input></td>
<td><input></td>
<td class="coef">6</td>
</tr>

<tr>
<td>Spécialité abandonnée</td>
<td><input></td>
<td>-</td>
<td class="coef">8</td>
</tr>

</table>

<div class="actions">
<button onclick="calcul()">Calculer</button>
<button onclick="save()">💾 Sauvegarder</button>

<label class="file-label">
📂 Charger
<input type="file" onchange="loadFile(event)">
</label>
</div>

</div>

<div class="popup" id="popup">
<div class="popup-content" id="popupContent"></div>
</div>

<script>
function getMention(note) {
    if(note >= 16) return "Très Bien 🏆";
    if(note >= 14) return "Bien 🎉";
    if(note >= 12) return "Assez Bien 👍";
    if(note >= 10) return "Admis ✅";
    return "Ajourné ❌";
}

function calcul() {
    let total = 0, coefTotal = 0;
    let totalPot = 0, hasEmpty = false;

    document.querySelectorAll("tr").forEach((row,i)=>{
        let coefEl = row.querySelector(".coef");
        if(!coefEl) return;

        let coef = +coefEl.innerText;
        coefTotal += coef;

        let inputs = row.querySelectorAll("input");
        let notes = [];

        inputs.forEach(i=>{
            if(i.value !== "") notes.push(+i.value);
        });

        if(notes.length > 0) {
            let avg = notes.reduce((a,b)=>a+b,0)/notes.length;
            total += avg * coef;
            totalPot += avg * coef;
        } else {
            hasEmpty = true;
            totalPot += 20 * coef;
        }
    });

    let note = total / coefTotal;
    let note2000 = (note/20)*2000;

    let html = `
    <div class="result-note">${note.toFixed(2)}/20</div>
    <div>${note2000.toFixed(0)} / 2000</div>
    <div class="mention">${getMention(note)}</div>
    `;

    if(hasEmpty) {
        let notePot = totalPot / coefTotal;
        let notePot2000 = (notePot/20)*2000;

        html += `
        <div class="potential">
        🚀 Potentiel max : ${notePot.toFixed(2)}/20<br>
        (${notePot2000.toFixed(0)} / 2000)
        </div>`;
    }

    document.getElementById("popupContent").innerHTML = html;
    document.getElementById("popup").classList.add("active");
}

document.getElementById("popup").onclick = () => {
    document.getElementById("popup").classList.remove("active");
};

function save(){
    let data=[...document.querySelectorAll("input")].map(i=>i.value);
    let blob=new Blob([JSON.stringify(data)]);
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="bac.json";
    a.click();
}

function loadFile(e){
    let r=new FileReader();
    r.onload=()=>{
        let data=JSON.parse(r.result);
        document.querySelectorAll("input").forEach((i,idx)=>{
            i.value=data[idx]||"";
        });
    };
    r.readAsText(e.target.files[0]);
}
</script>

</body>
</html>
